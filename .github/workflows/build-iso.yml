name: Build Borealis Linux ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: debian:bookworm
      options: --privileged
    timeout-minutes: 170
    steps:
      - name: Prepare container (git+sudo needed for checkout & non-root build)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends git sudo ca-certificates

      - uses: actions/checkout@v4

      - name: Show disk headroom
        run: df -h / "$GITHUB_WORKSPACE" || true

      - name: Bootstrap build host (live-build, toolchain, full apt components)
        run: ./scripts/bootstrap-host.sh

      - name: Build ISO
        run: ./build.sh

      - name: Show result + free disk
        run: |
          ls -lh borealis-*-amd64.iso*
          df -h / || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: borealis-linux-iso
          path: |
            borealis-*-amd64.iso
            borealis-*-amd64.iso.sha256
          retention-days: 14
          compression-level: 0

  release:
    needs: build-iso
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built ISO
        uses: actions/download-artifact@v4
        with:
          name: borealis-linux-iso

      - name: Prepare release assets (GitHub caps a single asset at 2 GiB)
        run: |
          mkdir -p release-assets
          ISO=$(ls borealis-*-amd64.iso)
          SIZE=$(stat -c%s "$ISO")
          if [ "$SIZE" -lt 2000000000 ]; then
            echo "single-file release (${SIZE} bytes)"
            cp "$ISO" release-assets/
            (cd release-assets && sha256sum "$ISO" > "$ISO.sha256")
          else
            echo "ISO is ${SIZE} bytes — releasing as split parts"
            sha256sum "$ISO" > "release-assets/$ISO.single.sha256"
            split -b 1900m -d "$ISO" "release-assets/$ISO.part-"
            (cd release-assets && sha256sum "$ISO".part-* > "$ISO.parts.sha256")
            printf '%s\n' \
              '# Reassembling the split ISO' \
              '' \
              'Rejoin the parts and verify:' \
              '' \
              '    cat borealis-1.0-amd64.iso.part-* > borealis-1.0-amd64.iso' \
              '    sha256sum -c borealis-1.0-amd64.iso.single.sha256' \
              '' \
              '(On Windows cmd: copy /b part-00+part-01+... borealis.iso)' \
              > release-assets/JOIN.md
          fi
          ls -lh release-assets/

      - name: Publish rolling 'continuous' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Borealis Linux 1.0 "Glacier" — continuous build
          body: |
            Automated build of Borealis Linux from commit
            ${{ github.sha }} (branch ${{ github.ref_name }}).

            * Hybrid BIOS+UEFI live/installer ISO, Debian 12 base
            * If the ISO is shipped as split parts, see JOIN.md
            * Verification matrix: see TESTPLAN.md in the repository
          prerelease: true
          files: release-assets/*
          fail_on_unmatched_files: true
