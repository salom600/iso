# Borealis Linux — installed-system GRUB defaults
# (the live ISO uses live-build's own bootloader config)
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
# Detect Windows/other Linux for the dual-boot menu (off by default since GRUB 2.06)
GRUB_DISABLE_OS_PROBER=false
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
