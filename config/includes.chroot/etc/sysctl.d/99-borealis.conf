# Borealis Linux — kernel tunables
# Targets: snappy desktop on 2008-era hardware, no IO storms at idle.

# Don't swap out the desktop until memory pressure is real (zram handles the rest)
vm.swappiness = 15
vm.vfs_cache_pressure = 50

# Slightly longer dirty writeback coalescing = fewer IO spikes on old HDDs
vm.dirty_writeback_centisecs = 1500

# NMI watchdog burns a perf counter + wakes on old CPUs — off
kernel.nmi_watchdog = 0

# Networking: fair queueing + BBR where available (safe no-op if module absent)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
