# Borealis Shell — Wayfire configuration (floating desktop, Win11/macOS hybrid)
# Docs: USAGE.md has the full shortcut table. Validated against Wayfire 0.7.x.

[core]
plugins = autostart command expo scale switcher grid animate decor move resize place alpha window-rules
vwidth = 3
vheight = 1

[autostart]
# Export session env into the systemd user manager so portals, PipeWire and
# xdg-desktop-portal-wlr see the Wayland display.
env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
bar = borealis-bar
wallpaper = borealis-wallpaper
notifications = swaync
network = nm-applet --indicator
polkit = /usr/lib/policykit-1-gnome-authentication-agent-1
idle = swayidle -w timeout 900 borealis-lock before-sleep borealis-lock
welcome = borealis-welcome --autostart

[command]
# Start menu — Super+Space and Ctrl+Esc (Windows 11 muscle memory)
binding_launcher  = <super> KEY_Space
binding_launcher2 = <ctrl> KEY_Escape
command_launcher  = borealis-menu

binding_terminal  = <super> KEY_T
binding_terminal2 = <ctrl> <alt> KEY_T
command_terminal  = foot

binding_files     = <super> KEY_E
command_files     = nemo

binding_web       = <super> KEY_W
command_web       = firefox-esr

binding_settings  = <super> KEY_I
command_settings  = borealis-settings

binding_quick     = <super> KEY_A
command_quick     = borealis-quick

binding_close     = <super> KEY_Q
command_close     = borealis-wm-helper close-active

binding_lock      = <super> KEY_L
command_lock      = borealis-lock

# Screenshots — Print = full screen, Super+Shift+S = snip area (Win11 style)
binding_screenshot_full = KEY_PRINT
command_screenshot_full = borealis-screenshot --full
binding_screenshot_area = <super> <shift> KEY_S
command_screenshot_area = borealis-screenshot --area

# Media keys
binding_volup   = XF86AudioRaiseVolume
command_volup   = pactl set-sink-volume @DEFAULT_SINK@ +5%
binding_voldown = XF86AudioLowerVolume
command_voldown = pactl set-sink-volume @DEFAULT_SINK@ -5%
binding_mute    = XF86AudioMute
command_mute    = pactl set-sink-mute @DEFAULT_SINK@ toggle

# Window snapping with Super+Arrows is provided by [grid] plugin defaults.
[grid]
duration = 150

# Alt+Tab window switcher
[switcher]
binding = <alt> KEY_TAB

# Super+Tab — desktop overview (like Windows Task View)
[expo]
binding = <super> KEY_TAB
duration = 300

# Subtle open/close animations; disabled by Performance Mode
[animate]
duration = 170
startup_duration = 320
open_animation = fade
close_animation = fade

[input]
xkb_layout = us
