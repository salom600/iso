# Borealis Linux — Calamares settings (Calamares 3.2/3.3 compatible)
# Installed to /etc/calamares by build.sh.
---
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - shellprocess
      - umount
  - show:
      - finished

branding: borealis
prompt-install: true
dont-chroot: false
