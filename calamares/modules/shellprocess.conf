# Post-install cleanup — runs chrooted in the TARGET system:
# remove live-session artifacts so the installed OS boots to a login screen.
---
dontChroot: false
script:
    - "rm -f /etc/lightdm/lightdm.conf.d/20-borealis-live-autologin.conf"
    - "userdel -r borealis 2>/dev/null || true"
    - "rm -rf /home/borealis"
    - "systemctl -q enable lightdm 2>/dev/null || true"
    - "echo installed > /etc/borealis-install-marker"
