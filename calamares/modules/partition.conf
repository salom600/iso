# Partitioning: erase / replace (alongside existing OS) / manual, ext4
# default, LUKS offered in erase & manual modes.
---
userSwapChoices:
    - none      # zram is preconfigured — recommended on machines 2008–2015
    - small
    - reuse
    - file
initialSwapChoice: none

defaultFileSystemType: "ext4"
enableLuksAutomatedPartitioning: true
allowManualPartitioning: true
drawNestedPartitions: false
alwaysShowPartitionLabels: true
ensureSuspendToDisk: false

initialPartitioningChoice: erase
availablePartitioningChoices:
    - erase
    - replace
    - alongside
    - manual

efiSystemPartition: "/boot/efi"
